const q=document.getElementById('q'), results=document.getElementById('results');
const count=document.getElementById('count'), hint=document.getElementById('hint'), clear=document.getElementById('clear');
let filter='all';

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function highlight(s,term){if(!term)return esc(s); const e=esc(s); const safe=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return e.replace(new RegExp('('+safe+')','ig'),'<mark>$1</mark>');}
function matches(r,term){
 const category=r["Business Type"], task=r.Task, ex=r.Examples;
 if(!term)return true;
 if(filter==='category')return category.toLowerCase().includes(term);
 if(filter==='task')return task.toLowerCase().includes(term);
 if(filter==='example')return ex.toLowerCase().includes(term);
 return (category+' '+task+' '+ex+' '+r.Status).toLowerCase().includes(term);
}
function render(){
 const term=q.value.trim().toLowerCase();
 clear.style.display=term?'block':'none';
 let arr=DATA.filter(r=>matches(r,term));
 const max=300;
 count.textContent=term ? `${arr.length.toLocaleString()} result${arr.length===1?'':'s'}` : `${DATA.length.toLocaleString()} tasks`;
 hint.textContent=term?'Tap a result to use the category/work':'Search by category, task, or example';
 if(!arr.length){results.innerHTML='<div class="no">No matching category or work found.<br><br>Try another keyword.</div>';return}
 results.innerHTML=arr.slice(0,max).map(r=>`<div class="card">
   <div class="badge">${highlight(r["Business Type"],term)}</div>
   <div class="task">${highlight(r.Task,term)}</div>
   ${r.Examples?`<div class="examples"><b>Examples:</b> ${highlight(r.Examples,term)}</div>`:''}
   ${r.Status?`<span class="status">${esc(r.Status)}</span>`:''}
 </div>`).join('');
 if(arr.length>max) hint.textContent=`Showing first ${max} of ${arr.length.toLocaleString()} results`;
}
q.addEventListener('input',render);
clear.addEventListener('click',()=>{q.value='';q.focus();render()});
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active')); b.classList.add('active');
 filter=b.dataset.filter; render();
}));
render();
</script>
